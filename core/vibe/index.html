<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>바이브코딩 스튜디오</title>
    <!-- 원본: 바운더리엑스 MakeCode 바이브코딩 브릿지(크롬 확장) v0.3.2의 sidepanel.html.
         웹앱판에서 바꾼 것: Font Awesome·Google Fonts·GitHub 파비콘(외부 주소) 대신 icons.css(자체 아이콘),
         bridge.js(chrome.runtime → 웹앱 MakeCode), patch.js(웹앱용 안내 문구·로고·바깥 링크 떼기·초점 순서), 제품 탭 숨김(이 수업 MakeCode에는 포니봇 확장만 있음),
         7차: 바깥 링크·© 줄 숨김과 ⚙ 옆 "접속키" 글자(아래 style), 터치 화면 44px 버튼(icons.css).
         app.js·tour.js·code-state.js·response-parser.js·studio.css·tailwind-output.css·react 번들은 원본 그대로다(sync 스크립트로 갱신). -->
    <link rel="stylesheet" href="tailwind-output.css">
    <link rel="stylesheet" href="studio.css">
    <link rel="stylesheet" href="icons.css">

    <style>
        @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css');

        :root {
            --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
        }
        body, #root, .font-sans, button, input, textarea, select {
            font-family: var(--font-main) !important;
        }
        .code-font {
            font-family: Consolas, 'D2Coding', 'Courier New', monospace !important;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        .bx-pill-btn {
            transition: all 0.2s;
            border-radius: 50px;
            font-weight: 600;
        }
        .bx-btn-black {
            background-color: #000;
            color: #fff;
        }
        .bx-btn-black:hover {
            background-color: #333;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .bx-btn-outline {
            background-color: #fff;
            color: #111;
            border: 1px solid #D1D5DB;
        }
        .bx-btn-outline:hover {
            background-color: #F8F9FA;
            border-color: #000;
        }
        .bx-btn-danger-outline {
            background-color: #fff;
            color: #EA4335;
            border: 1px solid #D1D5DB;
        }
        .bx-btn-danger-outline:hover {
            background-color: #FFF5F5;
            border-color: #EA4335;
        }
        ::selection { background: #000; color: #fff; }
        /* 웹앱판: 이 수업의 MakeCode 프로젝트에는 AI 포니봇 확장만 있어 다른 제품 탭은 숨긴다(app.js 기본값이 포니봇) */
        [data-tour="product-tabs"] { display: none !important; }
        /* 웹앱판(7차 R7-07-P1-5, 사용자 결정 12): 수업 밖으로 나가는 링크와 © 줄을 숨긴다.
           - "제품 정보"(boundaryx.io/shop, title="제품 정보") 링크는 숨김. patch.js가 href도 뗀다.
           - 로고 링크(boundaryx.io)는 그림·이름은 보이고 누를 수 없게. patch.js가 href를 떼서 Tab에서도 빠진다.
           - 바닥 줄: 원본 footer는 div.footer-brand("Boundary X"·사용법) + span("© 2024")이라 footer 바로 아래 span이 © 줄이다(3.66:1·11px 대비 미달). */
        [data-tour="studio-header"] a[title="제품 정보"] { display: none !important; }
        [data-tour="studio-header"] a[href^="https://boundaryx.io"] { pointer-events: none; }
        #studio-content > footer > span { display: none !important; }
        /* ⚙ 버튼 옆 작은 글자 "접속키": 처음 쓰는 학생이 접속키 넣을 곳을 찾게. 이름은 patch.js가 aria-label="접속키 설정"으로 */
        [data-tour="access-settings"] { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        [data-tour="access-settings"]::after { content: '접속키'; font-size: 12px; font-weight: 600; line-height: 1; }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>

    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
    <script src="bridge.js"></script>
    <script src="response-parser.js"></script>
    <script src="code-state.js"></script>
    <script src="tour.js"></script>
    <script src="patch.js"></script>
    <script src="app.js"></script>
</body>
</html>
